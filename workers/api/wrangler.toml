name = "online-quiz"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# 前端构建产物由 Worker 静态资源托管（同源，无需额外 Pages 项目）
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "online-quiz"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# 可选：绑定 R2 后，上传的原始资料会额外保存一份到 R2；
# 不绑定也能正常使用（提取出的文本保存在 D1）。
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "online-quiz-sources"

[vars]
ENVIRONMENT = "development"
APP_NAME = "智能答题系统"
PASSWORD_ITERATIONS = "100000"
SESSION_TTL_HOURS = "72"
COOKIE_SECURE = "false"
TZ_OFFSET_MINUTES = "480"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
AI_ENABLED = "true"
AI_MAX_QUESTIONS_PER_REQUEST = "50"
AI_DAILY_TASK_LIMIT = "20"
AI_MAX_INPUT_CHARS = "24000"
AI_MAX_OUTPUT_TOKENS = "8000"
AI_TIMEOUT_MS = "120000"
UPLOAD_MAX_BYTES = "10485760"

# 生产环境建议：
#   wrangler secret put DEEPSEEK_API_KEY
#   wrangler secret put ADMIN_SETUP_TOKEN
# 并通过 `wrangler deploy` 覆盖 ENVIRONMENT=production（见 docs/DEPLOY.md）
